# Único ponto de entrada (porta 80). Domínio local fictício: clinica.localhost
# (*.localhost resolve para 127.0.0.1 nos navegadores modernos, sem editar /etc/hosts).

server_tokens off;

# Resolver do Docker: os serviços podem subir em qualquer ordem
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80 default_server;
  server_name clinica.localhost localhost;

  root /usr/share/nginx/html;
  client_max_body_size 256k;

  # API: mesma origem do frontend (cookie HttpOnly SameSite=Strict, sem CORS)
  location /api/ {
    set $api http://backend:3000;
    proxy_pass $api;
    # Host preservado: a proteção CSRF compara Origin com Host
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # correlação de logs: o requestId nasce aqui e segue até os logs e a auditoria
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
  }

  # assets com hash no nome: cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: rotas do TanStack Router caem no index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

# PACS de demonstração: Orthanc + Stone Web Viewer, sem autenticação (escopo de demonstração)
server {
  listen 80;
  server_name pacs.clinica.localhost;
  client_max_body_size 0;

  location = / {
    return 302 /ui/app/;
  }

  location / {
    set $orthanc http://orthanc:8042;
    proxy_pass $orthanc;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

server {
  listen 80;
  server_name grafana.clinica.localhost;

  location / {
    set $grafana http://grafana:3000;
    proxy_pass $grafana;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Live (websocket) do Grafana
  location /api/live/ {
    set $grafana http://grafana:3000;
    proxy_pass $grafana;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
